name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DotnetLift.slnx

      - name: Build
        run: dotnet build DotnetLift.slnx --no-restore -c Release

      - name: Test
        run: dotnet test DotnetLift.slnx --no-build -c Release --logger "console;verbosity=normal"

      - name: Analyze the sample solution
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run --project src/DotnetLift.Cli -c Release --no-build -- analyze samples/LegacyShop --yes -o lift-report.md

      - name: Upgrade the sample with dotnet-lift (including the real build-fix loop), then build net48
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cp -r samples/LegacyShop "$RUNNER_TEMP/LegacyShop"
          cd "$RUNNER_TEMP/LegacyShop"
          git init -q
          git config user.name ci
          git config user.email ci@example.com
          git add -A && git commit -qm "legacy sample"
          dotnet run --project "$GITHUB_WORKSPACE/src/DotnetLift.Cli" -c Release --no-build -- upgrade . --yes --accept-risky
          git log --oneline
          cat LegacyShop.Data/LegacyShop.Data.csproj
          # Web.config settings were copied to appsettings.json; it must be plain JSON (no notes for the sample).
          python3 -m json.tool LegacyShop.Web/appsettings.json
          test -f LegacyShop.Web/Web.config
          # The .NET Framework target must keep building: the old web app still uses these libraries.
          dotnet build LegacyShop.Core/LegacyShop.Core.csproj -f net48
          dotnet build LegacyShop.Data/LegacyShop.Data.csproj -f net48
          # After the upgrade both libraries are free of System.Web: they must build for net10.0 as well.
          dotnet build LegacyShop.Core/LegacyShop.Core.csproj -f net10.0
          dotnet build LegacyShop.Data/LegacyShop.Data.csproj -f net10.0
          # Test-first workflow: a scaffolded MSTest project follows the library's targets and runs on the new one.
          dotnet run --project "$GITHUB_WORKSPACE/src/DotnetLift.Cli" -c Release --no-build -- add-tests . --project LegacyShop.Core --yes --allow-dirty
          git log --oneline -1
          cat LegacyShop.Core.Tests/LegacyShop.Core.Tests.csproj
          dotnet build LegacyShop.Core.Tests/LegacyShop.Core.Tests.csproj -f net48
          dotnet test LegacyShop.Core.Tests/LegacyShop.Core.Tests.csproj -f net10.0

      - name: Upgrade the sample, add a test project and run its tests on net48 and net10.0
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cp -r samples/LegacyShop "$RUNNER_TEMP/WinTests"
          cd "$RUNNER_TEMP/WinTests"
          git init -q
          git config user.name ci
          git config user.email ci@example.com
          git add -A && git commit -qm "legacy sample"
          dotnet run --project "$GITHUB_WORKSPACE/src/DotnetLift.Cli" -c Release --no-build -- upgrade . --yes --accept-risky
          dotnet run --project "$GITHUB_WORKSPACE/src/DotnetLift.Cli" -c Release --no-build -- add-tests . --project LegacyShop.Core --yes --allow-dirty
          dotnet test LegacyShop.Core.Tests/LegacyShop.Core.Tests.csproj

      - name: BinaryFormatter compatibility path - data written on net48 is read back on net10.0
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cp -r samples/LegacyShop "$RUNNER_TEMP/Compat"
          cd "$RUNNER_TEMP/Compat"
          printf '{ "target": "net10.0", "multiTarget": "always", "binaryFormatter": "compatibility" }\n' > dotnet-lift.json
          git init -q
          git config user.name ci
          git config user.email ci@example.com
          git add -A && git commit -qm "legacy sample"
          dotnet run --project "$GITHUB_WORKSPACE/src/DotnetLift.Cli" -c Release --no-build -- upgrade . --yes
          grep -q "new BinaryFormatter()" LegacyShop.Core/Services/SnapshotSerializer.cs
          # A small host app: like any application that runs the library on modern .NET, it sets the switch itself.
          mkdir Probe
          cat > Probe/Probe.csproj <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFrameworks>net48;net10.0</TargetFrameworks>
              <EnableUnsafeBinaryFormatterSerialization>true</EnableUnsafeBinaryFormatterSerialization>
              <NoWarn>$(NoWarn);SYSLIB0011</NoWarn>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="..\LegacyShop.Core\LegacyShop.Core.csproj" />
            </ItemGroup>
          </Project>
          XML
          cat > Probe/Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using LegacyShop.Core.Services;

          static class Program
          {
              static readonly string[] Value = { "cart-42", "İstanbul ığüşöç", "3" };

              static int Main(string[] args)
              {
                  if (args[0] == "write")
                  {
                      File.WriteAllBytes(args[1], SnapshotSerializer.Serialize(Value));
                      return 0;
                  }
                  var read = SnapshotSerializer.Deserialize<string[]>(File.ReadAllBytes(args[1]));
                  var again = SnapshotSerializer.Serialize(read);
                  Console.WriteLine(string.Join(" | ", read));
                  return read.SequenceEqual(Value) && again.SequenceEqual(File.ReadAllBytes(args[1])) ? 0 : 1;
              }
          }
          CS
          dotnet run --project Probe -f net48 -- write "$RUNNER_TEMP/snapshot.bin"
          dotnet run --project Probe -f net10.0 -- read "$RUNNER_TEMP/snapshot.bin"

      - name: Upgrade the sample with a migration profile (code page 1254, BinaryFormatter kept), then build both targets
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cp -r samples/LegacyShop "$RUNNER_TEMP/Profiled"
          cd "$RUNNER_TEMP/Profiled"
          printf '{ "target": "net10.0", "codePage": 1254, "binaryFormatter": "compatibility", "commits": "single" }\n' > dotnet-lift.json
          git init -q
          git config user.name ci
          git config user.email ci@example.com
          git add -A && git commit -qm "legacy sample"
          dotnet run --project "$GITHUB_WORKSPACE/src/DotnetLift.Cli" -c Release --no-build -- upgrade . --yes --accept-risky
          git log --oneline
          cat LegacyShop.Core/Services/PasswordHasher.cs
          cat LegacyShop.Core/LegacyShop.Core.csproj
          # The compatibility path keeps the BinaryFormatter code (and the stored format) as it is.
          grep -q "new BinaryFormatter()" LegacyShop.Core/Services/SnapshotSerializer.cs
          grep -q "System.Runtime.Serialization.Formatters" LegacyShop.Core/LegacyShop.Core.csproj
          dotnet build LegacyShop.Core/LegacyShop.Core.csproj -f net48
          dotnet build LegacyShop.Core/LegacyShop.Core.csproj -f net10.0
          dotnet build LegacyShop.Data/LegacyShop.Data.csproj -f net10.0

      - name: Upload sample report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sample-report
          path: lift-report.md
