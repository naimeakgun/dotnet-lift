name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DotnetLift.slnx

      - name: Build
        run: dotnet build DotnetLift.slnx --no-restore -c Release

      - name: Test
        run: dotnet test DotnetLift.slnx --no-build -c Release --logger "console;verbosity=normal"

      - name: Analyze the sample solution
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run --project src/DotnetLift.Cli -c Release --no-build -- analyze samples/LegacyShop --yes -o lift-report.md

      - name: Upgrade the sample with dotnet-lift (including the real build-fix loop), then build net48
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cp -r samples/LegacyShop "$RUNNER_TEMP/LegacyShop"
          cd "$RUNNER_TEMP/LegacyShop"
          git init -q
          git config user.name ci
          git config user.email ci@example.com
          git add -A && git commit -qm "legacy sample"
          dotnet run --project "$GITHUB_WORKSPACE/src/DotnetLift.Cli" -c Release --no-build -- upgrade . --yes --accept-risky
          git log --oneline
          cat LegacyShop.Data/LegacyShop.Data.csproj
          # Web.config settings were copied to appsettings.json; it must be plain JSON (no notes for the sample).
          python3 -m json.tool LegacyShop.Web/appsettings.json
          test -f LegacyShop.Web/Web.config
          # The .NET Framework target must keep building: the old web app still uses these libraries.
          dotnet build LegacyShop.Core/LegacyShop.Core.csproj -f net48
          dotnet build LegacyShop.Data/LegacyShop.Data.csproj -f net48
          # After the upgrade both libraries are free of System.Web: they must build for net10.0 as well.
          dotnet build LegacyShop.Core/LegacyShop.Core.csproj -f net10.0
          dotnet build LegacyShop.Data/LegacyShop.Data.csproj -f net10.0
          # Test-first workflow: a scaffolded MSTest project follows the library's targets and runs on the new one.
          dotnet run --project "$GITHUB_WORKSPACE/src/DotnetLift.Cli" -c Release --no-build -- add-tests . --project LegacyShop.Core --yes --allow-dirty
          git log --oneline -1
          cat LegacyShop.Core.Tests/LegacyShop.Core.Tests.csproj
          dotnet build LegacyShop.Core.Tests/LegacyShop.Core.Tests.csproj -f net48
          dotnet test LegacyShop.Core.Tests/LegacyShop.Core.Tests.csproj -f net10.0

      - name: Upgrade the sample, add a test project and run its tests on net48 and net10.0
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cp -r samples/LegacyShop "$RUNNER_TEMP/WinTests"
          cd "$RUNNER_TEMP/WinTests"
          git init -q
          git config user.name ci
          git config user.email ci@example.com
          git add -A && git commit -qm "legacy sample"
          dotnet run --project "$GITHUB_WORKSPACE/src/DotnetLift.Cli" -c Release --no-build -- upgrade . --yes --accept-risky
          dotnet run --project "$GITHUB_WORKSPACE/src/DotnetLift.Cli" -c Release --no-build -- add-tests . --project LegacyShop.Core --yes --allow-dirty
          dotnet test LegacyShop.Core.Tests/LegacyShop.Core.Tests.csproj

      - name: BinaryFormatter compatibility path - data written on net48 is read back on net10.0
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cp -r samples/LegacyShop "$RUNNER_TEMP/Compat"
          cd "$RUNNER_TEMP/Compat"
          printf '{ "target": "net10.0", "multiTarget": "always", "binaryFormatter": "compatibility" }\n' > dotnet-lift.json
          git init -q
          git config user.name ci
          git config user.email ci@example.com
          git add -A && git commit -qm "legacy sample"
          dotnet run --project "$GITHUB_WORKSPACE/src/DotnetLift.Cli" -c Release --no-build -- upgrade . --yes
          grep -q "new BinaryFormatter()" LegacyShop.Core/Services/SnapshotSerializer.cs
          # A small host app: like any application that runs the library on modern .NET, it sets the switch itself.
          mkdir Probe
          cat > Probe/Probe.csproj <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFrameworks>net48;net10.0</TargetFrameworks>
              <EnableUnsafeBinaryFormatterSerialization>true</EnableUnsafeBinaryFormatterSerialization>
              <NoWarn>$(NoWarn);SYSLIB0011</NoWarn>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="..\LegacyShop.Core\LegacyShop.Core.csproj" />
            </ItemGroup>
          </Project>
          XML
          cat > Probe/Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using LegacyShop.Core.Services;

          static class Program
          {
              static readonly string[] Value = { "cart-42", "İstanbul ığüşöç", "3" };

              static int Main(string[] args)
              {
                  if (args[0] == "write")
                  {
                      File.WriteAllBytes(args[1], SnapshotSerializer.Serialize(Value));
                      return 0;
                  }
                  var read = SnapshotSerializer.Deserialize<string[]>(File.ReadAllBytes(args[1]));
                  var again = SnapshotSerializer.Serialize(read);
                  Console.WriteLine(string.Join(" | ", read));
                  return read.SequenceEqual(Value) && again.SequenceEqual(File.ReadAllBytes(args[1])) ? 0 : 1;
              }
          }
          CS
          dotnet run --project Probe -f net48 -- write "$RUNNER_TEMP/snapshot.bin"
          dotnet run --project Probe -f net10.0 -- read "$RUNNER_TEMP/snapshot.bin"

      - name: Upgrade the sample with a migration profile (code page 1254, BinaryFormatter kept), then build both targets
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cp -r samples/LegacyShop "$RUNNER_TEMP/Profiled"
          cd "$RUNNER_TEMP/Profiled"
          printf '{ "target": "net10.0", "codePage": 1254, "binaryFormatter": "compatibility", "commits": "single" }\n' > dotnet-lift.json
          git init -q
          git config user.name ci
          git config user.email ci@example.com
          git add -A && git commit -qm "legacy sample"
          dotnet run --project "$GITHUB_WORKSPACE/src/DotnetLift.Cli" -c Release --no-build -- upgrade . --yes --accept-risky
          git log --oneline
          cat LegacyShop.Core/Services/PasswordHasher.cs
          cat LegacyShop.Core/LegacyShop.Core.csproj
          # The compatibility path keeps the BinaryFormatter code (and the stored format) as it is.
          grep -q "new BinaryFormatter()" LegacyShop.Core/Services/SnapshotSerializer.cs
          grep -q "System.Runtime.Serialization.Formatters" LegacyShop.Core/LegacyShop.Core.csproj
          dotnet build LegacyShop.Core/LegacyShop.Core.csproj -f net48
          dotnet build LegacyShop.Core/LegacyShop.Core.csproj -f net10.0
          dotnet build LegacyShop.Data/LegacyShop.Data.csproj -f net10.0

      - name: Test-first workflow - golden vectors recorded on net48 catch an output change on net10.0
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cp -r samples/LegacyShop "$RUNNER_TEMP/Golden"
          cd "$RUNNER_TEMP/Golden"
          # Persisted snapshots keep BinaryFormatter; no code-page decision yet, so Encoding.Default changes meaning.
          printf '{ "target": "net10.0", "binaryFormatter": "compatibility" }\n' > dotnet-lift.json
          git init -q
          git config user.name ci
          git config user.email ci@example.com
          git add -A && git commit -qm "legacy sample"
          # 1. Tests first, while the library is still a .NET Framework project.
          dotnet run --project "$GITHUB_WORKSPACE/src/DotnetLift.Cli" -c Release --no-build -- add-tests . --project LegacyShop.Core --yes
          test -f LegacyShop.Core.Tests/GoldenVector.cs
          cat > LegacyShop.Core.Tests/OutputTests.cs <<'CS'
          using System.Globalization;
          using System.Text;
          using LegacyShop.Core.Models;
          using LegacyShop.Core.Services;
          using Microsoft.VisualStudio.TestTools.UnitTesting;

          namespace LegacyShop.Core.Tests
          {
              [TestClass]
              public class OutputTests
              {
                  [TestMethod]
                  public void Order_total_is_unchanged()
                  {
                      var order = new Order();
                      order.Lines.Add(new OrderLine { ProductId = 1, Quantity = 3, UnitPrice = 19.99m });
                      order.Lines.Add(new OrderLine { ProductId = 2, Quantity = 1, UnitPrice = 0.05m });

                      GoldenVector.Check("order-total", new PriceCalculator(0.20m).Total(order).ToString(CultureInfo.InvariantCulture));
                  }

                  [TestMethod]
                  public void Password_hash_is_unchanged()
                  {
                      // Hashes Encoding.Default bytes: the server's ANSI code page on .NET Framework, UTF-8 on modern .NET.
                      GoldenVector.Check("password-hash", Encoding.Unicode.GetBytes(PasswordHasher.Hash("Ömer", "café")));
                  }
              }
          }
          CS
          nuget restore LegacyShop.Core/packages.config -PackagesDirectory packages
          dotnet test LegacyShop.Core.Tests/LegacyShop.Core.Tests.csproj -f net48
          ls -l LegacyShop.Core.Tests/golden
          test -f LegacyShop.Core.Tests/golden/order-total.txt
          test -f LegacyShop.Core.Tests/golden/password-hash.bin
          # Recorded vectors are compared on the next run, on .NET Framework too.
          dotnet test LegacyShop.Core.Tests/LegacyShop.Core.Tests.csproj -f net48
          git add -A && git commit -qm "tests"
          # 2. The conversion. The library moves without a code-page decision, so the hash changes and the tests say so.
          dotnet run --project "$GITHUB_WORKSPACE/src/DotnetLift.Cli" -c Release --no-build -- upgrade . --yes | tee "$RUNNER_TEMP/upgrade.txt" || true
          grep -F "LegacyShop.Core.Tests: tests fail on net10.0 (2 passed, 1 failed" "$RUNNER_TEMP/upgrade.txt"
          dotnet test LegacyShop.Core.Tests/LegacyShop.Core.Tests.csproj -f net10.0 > "$RUNNER_TEMP/net10.txt" 2>&1 && exit 1
          cat "$RUNNER_TEMP/net10.txt"
          grep -F "Golden vector password-hash.bin differs on .NET 10" "$RUNNER_TEMP/net10.txt"
          grep -F "Password_hash_is_unchanged" "$RUNNER_TEMP/net10.txt"
          if grep -F "Order_total_is_unchanged" "$RUNNER_TEMP/net10.txt"; then exit 1; fi
          # The same tests still pass on net48: the difference is the framework, not the tests.
          dotnet test LegacyShop.Core.Tests/LegacyShop.Core.Tests.csproj -f net48

      - name: SqlClient - a data library moves to Microsoft.Data.SqlClient and builds for net48 and net10.0
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/Sql/Acme.Data" && cd "$RUNNER_TEMP/Sql"
          printf '{ "target": "net10.0", "multiTarget": "always", "sqlClient": "microsoft" }\n' > dotnet-lift.json
          cat > Acme.Data/Acme.Data.csproj <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net48</TargetFramework>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="System.Data.SqlClient" Version="4.9.0" />
            </ItemGroup>
          </Project>
          XML
          cat > Acme.Data/OrderStore.cs <<'CS'
          using System.Data;
          using System.Data.SqlClient;

          namespace Acme.Data
          {
              public class OrderStore
              {
                  private readonly string _connectionString;

                  public OrderStore(string connectionString) { _connectionString = connectionString; }

                  public int Count(int customerId)
                  {
                      using (var connection = new SqlConnection(_connectionString))
                      using (var command = new System.Data.SqlClient.SqlCommand("select count(*) from Orders where CustomerId = @id", connection))
                      {
                          command.Parameters.Add(new SqlParameter("@id", SqlDbType.Int) { Value = customerId });
                          connection.Open();
                          return (int)command.ExecuteScalar();
                      }
                  }

                  public static SqlConnectionStringBuilder Describe(string connectionString) => new SqlConnectionStringBuilder(connectionString);
              }
          }
          CS
          git init -q
          git config user.name ci
          git config user.email ci@example.com
          git add -A && git commit -qm "data library"
          dotnet build Acme.Data -f net48
          dotnet run --project "$GITHUB_WORKSPACE/src/DotnetLift.Cli" -c Release --no-build -- upgrade . --yes
          git log --oneline
          grep -q "using Microsoft.Data.SqlClient;" Acme.Data/OrderStore.cs
          ! grep -q "System.Data.SqlClient" Acme.Data/Acme.Data.csproj
          dotnet build Acme.Data -f net48
          dotnet build Acme.Data -f net10.0

      - name: Upload sample report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sample-report
          path: lift-report.md
