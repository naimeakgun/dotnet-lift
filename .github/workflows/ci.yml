name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DotnetLift.slnx

      - name: Build
        run: dotnet build DotnetLift.slnx --no-restore -c Release

      - name: Test
        run: dotnet test DotnetLift.slnx --no-build -c Release --logger "console;verbosity=normal"

      - name: Analyze the sample solution
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run --project src/DotnetLift.Cli -c Release --no-build -- analyze samples/LegacyShop --yes -o lift-report.md

      - name: Upgrade the sample with dotnet-lift, then build the converted libraries
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cp -r samples/LegacyShop "$RUNNER_TEMP/LegacyShop"
          cd "$RUNNER_TEMP/LegacyShop"
          git init -q
          git config user.name ci
          git config user.email ci@example.com
          git add -A && git commit -qm "legacy sample"
          dotnet run --project "$GITHUB_WORKSPACE/src/DotnetLift.Cli" -c Release --no-build -- upgrade . --yes
          git log --oneline
          cat LegacyShop.Data/LegacyShop.Data.csproj
          dotnet build LegacyShop.Core/LegacyShop.Core.csproj
          dotnet build LegacyShop.Data/LegacyShop.Data.csproj

      - name: Upload sample report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sample-report
          path: lift-report.md
