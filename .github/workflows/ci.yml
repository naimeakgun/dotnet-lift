name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DotnetLift.slnx

      - name: Build
        run: dotnet build DotnetLift.slnx --no-restore -c Release

      - name: Test
        run: dotnet test DotnetLift.slnx --no-build -c Release --logger "console;verbosity=normal"

      - name: Analyze the sample solution
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run --project src/DotnetLift.Cli -c Release --no-build -- analyze samples/LegacyShop --yes -o lift-report.md

      - name: Upgrade the sample with dotnet-lift (including the real build-fix loop), then build net48
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cp -r samples/LegacyShop "$RUNNER_TEMP/LegacyShop"
          cd "$RUNNER_TEMP/LegacyShop"
          git init -q
          git config user.name ci
          git config user.email ci@example.com
          git add -A && git commit -qm "legacy sample"
          dotnet run --project "$GITHUB_WORKSPACE/src/DotnetLift.Cli" -c Release --no-build -- upgrade . --yes --accept-risky
          git log --oneline
          cat LegacyShop.Data/LegacyShop.Data.csproj
          # Web.config settings were copied to appsettings.json; it must be plain JSON (no notes for the sample).
          python3 -m json.tool LegacyShop.Web/appsettings.json
          test -f LegacyShop.Web/Web.config
          # The .NET Framework target must keep building: the old web app still uses these libraries.
          dotnet build LegacyShop.Core/LegacyShop.Core.csproj -f net48
          dotnet build LegacyShop.Data/LegacyShop.Data.csproj -f net48
          # After the upgrade both libraries are free of System.Web: they must build for net10.0 as well.
          dotnet build LegacyShop.Core/LegacyShop.Core.csproj -f net10.0
          dotnet build LegacyShop.Data/LegacyShop.Data.csproj -f net10.0

      - name: Upgrade the sample with a migration profile (code page 1254), then build both targets
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cp -r samples/LegacyShop "$RUNNER_TEMP/Profiled"
          cd "$RUNNER_TEMP/Profiled"
          printf '{ "target": "net10.0", "codePage": 1254, "commits": "single" }\n' > dotnet-lift.json
          git init -q
          git config user.name ci
          git config user.email ci@example.com
          git add -A && git commit -qm "legacy sample"
          dotnet run --project "$GITHUB_WORKSPACE/src/DotnetLift.Cli" -c Release --no-build -- upgrade . --yes --accept-risky
          git log --oneline
          cat LegacyShop.Core/Services/PasswordHasher.cs
          dotnet build LegacyShop.Core/LegacyShop.Core.csproj -f net48
          dotnet build LegacyShop.Core/LegacyShop.Core.csproj -f net10.0

      - name: Upload sample report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sample-report
          path: lift-report.md
